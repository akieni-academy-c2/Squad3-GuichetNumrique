services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db_squad_3
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: squad_3
    volumes:
      - postgres-data-squad-3:/var/lib/postgresql/data

volumes:
  postgres-data-squad-3:
