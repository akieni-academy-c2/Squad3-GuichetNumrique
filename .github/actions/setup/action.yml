name: "Setup Node"
description: "Setup Node.js and install dependencies"

inputs:
  node-version-file:
    description: Node.js version file
    required: false
    default: ".nvmrc"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: npm
    - shell: bash
      run: npm ci
